name: Sync YouTube playlists

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync playlist videos
        run: node scripts/sync-youtube.mjs
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- src/data/youtube-videos.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/youtube-videos.json
          git commit -m "Update YouTube video catalog"
          git push
